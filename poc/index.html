<!doctype html>
<meta charset="utf-8">
<title>Image translate</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #0e0f11; --panel: #16181c; --edge: #262a31;
    --text: #e6e8ec; --dim: #8b929e; --accent: #5b9dff; --bad: #e06c5a; --ok: #62b47a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 32px 24px 64px; background: var(--bg); color: var(--text);
    font: 14px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    display: flex; justify-content: center;
  }
  main { width: 100%; max-width: 1080px; }
  h1 { font-size: 17px; margin: 0 0 4px; letter-spacing: -.01em; }
  .sub { color: var(--dim); margin: 0 0 24px; font-size: 13px; }

  .bar { display: flex; gap: 10px; align-items: center; margin-bottom: 14px; flex-wrap: wrap; }
  select, button {
    font: inherit; color: var(--text); background: var(--panel);
    border: 1px solid var(--edge); border-radius: 7px; padding: 7px 12px;
  }
  button { cursor: pointer; }
  button.primary { background: var(--accent); border-color: transparent; color: #08101f; font-weight: 600; }
  button[disabled] { opacity: .45; cursor: default; }

  #drop {
    border: 1px dashed var(--edge); border-radius: 12px; padding: 44px 20px;
    text-align: center; color: var(--dim); background: var(--panel);
    transition: border-color .15s, background .15s; cursor: pointer;
  }
  #drop.hot { border-color: var(--accent); background: #10161f; color: var(--text); }
  #drop b { color: var(--text); font-weight: 600; }

  #status { margin: 14px 0 0; color: var(--dim); font-size: 13px; min-height: 20px; }
  #status.bad { color: var(--bad); }

  .compare {
    position: relative; margin-top: 20px; border-radius: 12px; overflow: hidden;
    border: 1px solid var(--edge); background: #000; line-height: 0; user-select: none;
  }
  .compare img { display: block; width: 100%; }
  /* The overlay keeps the full size and is clipped. Narrowing the element
     instead would scale the image down rather than reveal what is under it. */
  .compare .after { position: absolute; inset: 0; }
  .compare .after img { width: 100%; height: 100%; }
  .handle {
    position: absolute; top: 0; bottom: 0; width: 2px; background: var(--accent);
    cursor: ew-resize; touch-action: none;
  }
  .handle::after {
    content: ""; position: absolute; top: 50%; left: 50%; width: 30px; height: 30px;
    transform: translate(-50%, -50%); border-radius: 50%;
    background: var(--accent); box-shadow: 0 2px 10px #0009;
  }
  .tag {
    position: absolute; top: 10px; font: 600 10px/1 -apple-system, sans-serif;
    letter-spacing: .09em; text-transform: uppercase; color: #fff;
    background: #0009; padding: 5px 8px; border-radius: 5px; pointer-events: none;
  }

  .meta { display: flex; gap: 18px; margin-top: 12px; color: var(--dim); font-size: 12px; flex-wrap: wrap; }
  .meta b { color: var(--text); font-weight: 600; font-variant-numeric: tabular-nums; }

  table { border-collapse: collapse; width: 100%; margin-top: 22px; font-size: 13px; }
  th { text-align: left; font-size: 10px; letter-spacing: .09em; text-transform: uppercase;
       color: var(--dim); font-weight: 600; padding: 0 10px 8px; }
  td { border-top: 1px solid var(--edge); padding: 9px 10px; vertical-align: top; }
  td.src { color: var(--dim); width: 42%; }
  tr.skipped td.en { color: var(--bad); }
  .why { display: block; font-size: 11px; color: var(--dim); margin-top: 2px; }
</style>

<main>
  <h1>Image translate</h1>
  <p class="sub">HunyuanOCR reads and locates the text, Qwen translates it, the original is painted over. All local.</p>

  <div class="bar">
    <label>Into
      <select id="target">
        <option>English</option><option>Chinese</option><option>Japanese</option>
        <option>Korean</option><option>Spanish</option><option>French</option>
        <option>German</option><option>Russian</option><option>Ukrainian</option>
      </select>
    </label>
    <label><input type="checkbox" id="shapes" checked> fit bubbles</label>
    <label><input type="checkbox" id="erase"> inpaint busy backgrounds (slow, poor on line art)</label>
    <button id="pick">Choose image…</button>
    <button id="again" class="primary" disabled>Run again</button>
    <input id="file" type="file" accept="image/*" hidden>
  </div>

  <div id="drop"><b>Drop an image here</b>, paste one, or choose a file.</div>
  <p id="status"></p>

  <div id="result" hidden>
    <div class="compare" id="compare">
      <img id="before" alt="original">
      <div class="after" id="afterClip"><img id="after" alt="translated"></div>
      <div class="tag" style="left:10px">original</div>
      <div class="tag" id="afterTag" style="right:10px">translated</div>
      <div class="handle" id="handle"></div>
    </div>
    <div class="meta">
      <span>read <b id="tRead">–</b></span>
      <span>translate <b id="tMt">–</b></span>
      <span>draw <b id="tDraw">–</b></span>
      <span><b id="nLines">–</b> lines → <b id="nBlocks">–</b> blocks</span>
      <span>inpainted <b id="nErased">–</b></span>
    </div>
    <table>
      <thead><tr><th>original</th><th>translated</th></tr></thead>
      <tbody id="rows"></tbody>
    </table>
  </div>
</main>

<script>
const $ = (id) => document.getElementById(id);
let lastFile = null;

function say(text, bad) {
  $('status').textContent = text;
  $('status').className = bad ? 'bad' : '';
}

async function send(file) {
  lastFile = file;
  $('again').disabled = true;
  say('Reading the image…');
  const started = performance.now();
  try {
    const response = await fetch('/translate', {
      method: 'POST',
      headers: {
        'X-Target-Language': $('target').value,
        'X-Erase': $('erase').checked ? 'auto' : 'off',
        'X-Shapes': $('shapes').checked ? 'on' : 'off',
      },
      body: file,
    });
    const data = await response.json();
    if (!response.ok) throw new Error(data.error || response.statusText);
    show(data, performance.now() - started);
  } catch (e) {
    say(e.message, true);
  } finally {
    $('again').disabled = !lastFile;
  }
}

function show(data, wall) {
  $('before').src = data.original;
  $('after').src = data.image;
  $('result').hidden = false;

  const skipped = data.blocks.filter((b) => b.skipped).length;
  $('tRead').textContent = (data.timings.read_ms / 1000).toFixed(1) + 's';
  $('tMt').textContent = (data.timings.translate_ms / 1000).toFixed(1) + 's';
  $('tDraw').textContent = data.timings.render_ms + 'ms';
  $('nLines').textContent = data.timings.lines;
  $('nBlocks').textContent = data.blocks.length;
  $('nErased').textContent = data.timings.erased ?? 0;
  if (data.timings.erase_ms) {
    $('tDraw').textContent = data.timings.render_ms + 'ms + ' +
      (data.timings.erase_ms / 1000).toFixed(1) + 's erase';
  }

  $('rows').innerHTML = '';
  for (const block of data.blocks) {
    const row = $('rows').insertRow();
    if (block.skipped) row.className = 'skipped';
    const src = row.insertCell();
    src.className = 'src';
    src.textContent = block.src;
    const en = row.insertCell();
    en.className = 'en';
    en.textContent = block.en || '—';
    if (block.skipped) {
      const why = document.createElement('span');
      why.className = 'why';
      why.textContent = 'left as-is: ' + block.skipped;
      en.append(why);
    }
  }
  say(`Done in ${(wall / 1000).toFixed(1)}s`
      + (skipped ? ` — ${skipped} block(s) left untouched.` : '.'));
  place(0.5);
}

// Comparison slider. The translated half is clipped from the left edge so the
// handle position reads as "how much of the result you are looking at".
function place(ratio) {
  const clamped = Math.max(0, Math.min(1, ratio));
  const pct = clamped * 100;
  $('afterClip').style.clipPath = 'inset(0 ' + (100 - pct) + '% 0 0)';
  $('handle').style.left = pct + '%';
  $('afterTag').style.opacity = clamped < 0.25 ? 0 : 1;
}

let dragging = false;
const ratioFrom = (e) => {
  const rect = $('compare').getBoundingClientRect();
  return ((e.touches ? e.touches[0].clientX : e.clientX) - rect.left) / rect.width;
};
$('compare').addEventListener('pointerdown', (e) => { dragging = true; place(ratioFrom(e)); });
addEventListener('pointermove', (e) => { if (dragging) place(ratioFrom(e)); });
addEventListener('pointerup', () => { dragging = false; });

const drop = $('drop');
drop.addEventListener('click', () => $('file').click());
$('pick').addEventListener('click', () => $('file').click());
$('file').addEventListener('change', (e) => e.target.files[0] && send(e.target.files[0]));
$('again').addEventListener('click', () => lastFile && send(lastFile));

for (const type of ['dragenter', 'dragover']) {
  drop.addEventListener(type, (e) => { e.preventDefault(); drop.classList.add('hot'); });
}
for (const type of ['dragleave', 'drop']) {
  drop.addEventListener(type, () => drop.classList.remove('hot'));
}
drop.addEventListener('drop', (e) => {
  e.preventDefault();
  const file = e.dataTransfer.files[0];
  if (file) send(file);
});
addEventListener('paste', (e) => {
  const item = [...e.clipboardData.items].find((i) => i.type.startsWith('image/'));
  if (item) send(item.getAsFile());
});
</script>
