<meta charset="utf-8">
<title>In-Place Translate</title>
<style>
  :root { color-scheme: light dark; }
  body {
    width: 260px; margin: 0; padding: 14px;
    font: 13px/1.45 -apple-system, BlinkMacSystemFont, sans-serif;
  }
  h1 { font-size: 13px; margin: 0 0 12px; font-weight: 600; }
  label { display: block; margin-bottom: 10px; }
  span { display: block; opacity: .65; margin-bottom: 3px; font-size: 11px; }
  select { width: 100%; font: inherit; padding: 3px; }
  .row { display: flex; gap: 8px; margin-top: 4px; }
  button { flex: 1; font: inherit; padding: 5px; }
  .check { display: flex; align-items: center; gap: 6px; margin: 10px 0 0; }
  .check span { margin: 0; opacity: 1; font-size: 13px; }
  #status { margin-top: 10px; min-height: 30px; opacity: .8; font-size: 11px; white-space: pre-wrap; }
  #status.bad { color: #c0392b; opacity: 1; }
</style>
<h1>In-Place Translate</h1>
<label>
  <span>From</span>
  <select id="source"></select>
</label>
<label>
  <span>To</span>
  <select id="target"></select>
</label>
<div class="row">
  <button id="run">Translate</button>
  <button id="restore">Restore</button>
</div>
<label class="check">
  <input type="checkbox" id="auto">
  <span>Translate pages automatically</span>
</label>
<div id="status"></div>
<script src="popup.js"></script>
