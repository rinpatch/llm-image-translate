<meta charset="utf-8">
<title>Image Translate</title>
<style>
  :root { color-scheme: light dark; }
  body { width: 280px; margin: 0; padding: 14px;
         font: 13px/1.45 -apple-system, BlinkMacSystemFont, sans-serif; }
  h1 { font-size: 13px; margin: 0 0 12px; font-weight: 600; }
  label { display: block; margin-bottom: 10px; }
  label > span { display: block; opacity: .65; margin-bottom: 3px; font-size: 11px; }
  select, input[type=url] { width: 100%; font: inherit; padding: 4px; }
  .check { display: flex; align-items: center; gap: 6px; margin: 12px 0 0; }
  .check span { margin: 0; opacity: 1; font-size: 13px; }
  #status { margin-top: 12px; min-height: 32px; font-size: 11px; opacity: .8; white-space: pre-wrap; }
  #status.bad { color: #c0392b; opacity: 1; }
  #status.ok { color: #2f855a; opacity: 1; }
  details { margin-top: 10px; }
  summary { font-size: 11px; opacity: .65; cursor: pointer; }
</style>
<h1>Image Translate</h1>

<label>
  <span>Translate from</span>
  <select id="source"></select>
</label>

<label>
  <span>Translate into</span>
  <select id="target"></select>
</label>

<label class="check">
  <input type="checkbox" id="images">
  <span>Show a badge on images</span>
</label>

<details>
  <summary>llama.cpp servers</summary>
  <label><span>Reader (HunyuanOCR)</span><input type="url" id="reader"></label>
  <label><span>Translator (TranslateGemma)</span><input type="url" id="translator"></label>
  <label class="check"><input type="checkbox" id="debug"><span>Log every stage</span></label>
</details>

<div id="status"></div>
<script src="dist/popup.js"></script>
