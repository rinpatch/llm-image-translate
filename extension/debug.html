<meta charset="utf-8">
<title>LLM Image Translate regions</title>
<link rel="stylesheet" href="ui.css">
<style>
  body { max-width: 1100px; margin: 0 auto; padding: 32px 24px 64px; }

  .tools { display: flex; align-items: center; gap: calc(var(--step) * 4);
           flex-wrap: wrap; margin-bottom: calc(var(--step) * 3); }
  .tools label { margin: 0; }

  /* The image sets the size and the boxes are placed on it in per cent, so the
     whole thing scales with the window and the coordinates still land. */
  .stage { position: relative; line-height: 0; background: var(--sunken);
           border: 1px solid var(--line); border-radius: var(--radius);
           overflow: hidden; }
  .stage img { width: 100%; height: auto; }
  .stage .missing { line-height: 1.5; padding: 24px; color: var(--muted); font-size: 12px; }

  .mark { position: absolute; box-sizing: border-box; pointer-events: auto; }
  /* A line the reader found, drawn in its block's colour: two lines of one
     colour are two lines that were merged. */
  .mark.spot { border: 1px solid; opacity: .85; }
  .mark.block { border: 2px dashed; }
  .mark.drawn { border: 1px solid; opacity: .5;
                background: repeating-linear-gradient(45deg, transparent,
                  transparent 4px, currentColor 4px, currentColor 5px); }
  .mark.lit { box-shadow: 0 0 0 2px var(--bg), 0 0 0 4px currentColor; opacity: 1; }
  .mark.spot.lit { background: color-mix(in srgb, currentColor 22%, transparent); }

  .blocks { margin-top: calc(var(--step) * 5); }
  .entry { display: grid; grid-template-columns: 10px 1fr; gap: calc(var(--step) * 3);
           padding: calc(var(--step) * 2) 0; border-top: 1px solid var(--line);
           cursor: pointer; }
  .entry:hover, .entry.lit { background: var(--sunken); }
  .entry > i { border-radius: 2px; margin-top: 3px; }
  .entry .what { font-size: 12px; color: var(--muted); }
  .entry .en { margin-top: 2px; }
  .entry ol { margin: 4px 0 0; padding-left: 20px; font-size: 12px; }
  .entry ol li { color: var(--muted); }
  .entry ol li b { font-weight: 400; color: var(--fg); }
  .entry .skipped { color: var(--bad); font-size: 12px; }

  .loose { color: var(--muted); font-size: 12px; margin-top: calc(var(--step) * 3); }

  pre#logged { font-size: 12px; line-height: 1.45; margin: 0; padding: calc(var(--step) * 3);
               background: var(--sunken); border-radius: var(--radius);
               max-height: 420px; overflow: auto; white-space: pre-wrap;
               word-break: break-word; }
</style>

<div id="app"></div>
<script src="dist/debug.js"></script>
