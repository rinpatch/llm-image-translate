<meta charset="utf-8">
<title>Image Translate settings</title>
<style>
  :root { color-scheme: light dark; }
  body { max-width: 560px; margin: 0 auto; padding: 32px 24px 64px;
         font: 14px/1.5 -apple-system, BlinkMacSystemFont, sans-serif; }
  h1 { font-size: 17px; margin: 0 0 4px; }
  h2 { font-size: 14px; margin: 0 0 2px; }
  p.blurb { margin: 0 0 14px; opacity: .65; font-size: 12px; }
  section { margin-top: 28px; padding-top: 20px; border-top: 1px solid rgba(128,128,128,.3); }
  label { display: block; margin-bottom: 12px; }
  label > span { display: block; opacity: .65; margin-bottom: 3px; font-size: 12px; }
  input, select { width: 100%; font: inherit; padding: 5px 6px; box-sizing: border-box; }
  .row { display: flex; gap: 12px; }
  .row > label { flex: 1; }
  .check { display: flex; align-items: center; gap: 8px; }
  .check input { width: auto; }
  .check span { margin: 0; opacity: 1; font-size: 14px; }
  .status { font-size: 12px; min-height: 18px; opacity: .8; }
  .status.ok { color: #2f855a; opacity: 1; }
  .status.bad { color: #c0392b; opacity: 1; }
  button { font: inherit; padding: 6px 14px; margin-top: 4px; }
  footer { margin-top: 28px; font-size: 12px; opacity: .65; }
</style>

<h1>Image Translate</h1>
<p class="blurb">Two OpenAI-compatible endpoints: one finds and reads the text, one
translates it. They can be the same server.</p>

<section>
  <h2>Reader</h2>
  <p class="blurb">Locates the text in the image and says what it says.</p>
  <label><span>Endpoint</span><input type="url" id="reader-baseUrl"
    placeholder="http://127.0.0.1:8090"></label>
  <div class="row">
    <label><span>Model (optional)</span><input type="text" id="reader-model"></label>
    <label><span>Adapter</span><select id="reader-adapter"></select></label>
  </div>
  <label><span>API key (optional)</span><input type="password" id="reader-apiKey"
    autocomplete="off"></label>
  <div class="status" id="reader-status"></div>
</section>

<section>
  <h2>Translator</h2>
  <p class="blurb">Translates what the reader found.</p>
  <label><span>Endpoint</span><input type="url" id="translator-baseUrl"
    placeholder="http://127.0.0.1:8091"></label>
  <div class="row">
    <label><span>Model (optional)</span><input type="text" id="translator-model"></label>
    <label><span>Adapter</span><select id="translator-adapter"></select></label>
  </div>
  <label><span>API key (optional)</span><input type="password" id="translator-apiKey"
    autocomplete="off"></label>
  <div class="status" id="translator-status"></div>
</section>

<section>
  <h2>Pages</h2>
  <label class="check"><input type="checkbox" id="images">
    <span>Show a badge on images</span></label>
  <label class="check"><input type="checkbox" id="debug">
    <span>Log every stage to the console</span></label>
</section>

<footer>
  <button type="button" id="test">Test both endpoints</button>
</footer>
<script src="dist/options.js"></script>
