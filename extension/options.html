<meta charset="utf-8">
<title>LLM Image Translate settings</title>
<link rel="stylesheet" href="ui.css">
<style>
  body { max-width: 560px; margin: 0 auto; padding: 32px 24px 64px; }

  .served { margin: -6px 0 calc(var(--step) * 3); }
  .pack { align-items: center; margin-bottom: var(--step); }
  .pack .status { min-height: 0; }

  details { margin-bottom: calc(var(--step) * 3); font-size: 12px; }
  summary { color: var(--muted); cursor: pointer; margin-bottom: calc(var(--step) * 2); }

  #try.dropping { outline: 2px dashed var(--accent); outline-offset: 8px; }
  #try-stages { margin: calc(var(--step) * 3) 0; }
  #try-stages .total { font-size: 12px; color: var(--muted); }
  #try-blocks { margin: calc(var(--step) * 3) 0 0; padding-left: 20px; font-size: 12px; }
  #try-blocks li { margin-bottom: calc(var(--step) * 2); }
  #try-blocks .src { color: var(--muted); }
  #try-blocks .skipped { color: var(--muted); font-style: italic; }
</style>

<div id="app"></div>
<script src="dist/options.js"></script>
