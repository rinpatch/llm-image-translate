<meta charset="utf-8">
<title>LLM Image Translate stats</title>
<link rel="stylesheet" href="ui.css">
<style>
  body { max-width: 720px; margin: 0 auto; padding: 32px 24px 64px; }

  .strip { display: flex; gap: 28px; margin: 20px 0 4px; }
  .stat b { display: block; font-size: 21px; font-weight: 500; font-variant-numeric: tabular-nums; }
  .stat span { color: var(--muted); font-size: 12px; }

  h1 { margin-bottom: calc(var(--step) * 3); }
  .scope { max-width: 280px; margin-top: 16px; }

  table.history { width: 100%; table-layout: fixed; border-collapse: collapse;
                  font-size: 12px; }
  table.history th { text-align: left; font-weight: 400; color: var(--muted);
                     padding-bottom: 5px; border-bottom: 1px solid var(--line); }
  table.history td { padding: 5px 8px 5px 0; border-bottom: 1px solid var(--line);
                     vertical-align: middle; }
  table.history tr.run { cursor: pointer; }
  table.history tr.run:hover td { background: var(--sunken); }
  td.where, th.where { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  td.twist, th.twist { width: 16px; color: var(--muted); padding-right: 0; }
  td.when, th.when { width: 72px; }
  td.shape, th.shape { width: 28%; }
  td.total, th.total { text-align: right; width: 52px; }
  td.what, th.what { width: 76px; }
  tr.bad td.what { color: var(--bad); }
  tr.detail td { padding: 2px 0 12px 16px; color: var(--muted); }
  tr.detail .legend { max-width: 300px; }
  tr.detail .why { color: var(--bad); padding-top: 6px; }
  tr.detail .regions { display: inline-block; margin-top: 6px; }
</style>

<div id="app"></div>
<script src="dist/stats.js"></script>
